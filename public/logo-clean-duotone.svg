<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="modernBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Vibrant Tech Purple-to-Pink Gradient -->
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Inner Soft Fill -->
    <linearGradient id="innerFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Clean Drop Shadow -->
    <filter id="cleanShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8B5CF6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Icon Badge -->
  <rect width="512" height="512" rx="112" fill="url(#modernBg)"/>
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="2"/>

  <!-- GPS Pin Container -->
  <g filter="url(#cleanShadow)">
    <!-- Solid Filled GPS Pin -->
    <path d="M 256 65 
             C 170 65, 105 130, 105 215 
             C 105 310, 240 415, 256 428 
             C 272 415, 407 310, 407 215 
             C 407 130, 342 65, 256 65 Z" 
          fill="url(#innerFill)" 
          stroke="url(#techGradient)" 
          stroke-width="12" 
          stroke-linejoin="round"/>

    <!-- Central Sound Equalizer Rhythm Bars -->
    <!-- Bar 1 -->
    <rect x="180" y="180" width="10" height="50" rx="5" fill="url(#techGradient)" fill-opacity="0.4"/>
    <!-- Bar 2 -->
    <rect x="200" y="150" width="10" height="90" rx="5" fill="url(#techGradient)" fill-opacity="0.6"/>
    <!-- Bar 3 -->
    <rect x="220" y="125" width="10" height="135" rx="5" fill="url(#techGradient)" fill-opacity="0.85"/>
    <!-- Bar 4 (Under Question Mark) -->
    <rect x="282" y="140" width="10" height="110" rx="5" fill="url(#techGradient)" fill-opacity="0.85"/>
    <!-- Bar 5 -->
    <rect x="302" y="165" width="10" height="75" rx="5" fill="url(#techGradient)" fill-opacity="0.6"/>
    <!-- Bar 6 -->
    <rect x="322" y="190" width="10" height="35" rx="5" fill="url(#techGradient)" fill-opacity="0.4"/>

    <!-- Minimalist Question Mark '?' with white core and gradient border -->
    <path d="M 226 160 
             C 226 130, 242 118, 258 118 
             C 278 118, 294 132, 294 152 
             C 294 176, 260 188, 260 218 
             L 260 230" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Question Mark Dot -->
    <circle cx="260" cy="258" r="9" fill="#FFFFFF"/>
  </g>

  <!-- Clean Tech Typography -->
  <text x="256" y="475" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="3" 
        fill="#FFFFFF">
    Qual o <tspan fill="url(#techGradient)">Rolê?</tspan>
  </text>
</svg>
